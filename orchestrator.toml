# Regeln des Dual-Agent-Orchestrators fuer die RuhestandsApp.
# Vorlage: docs/reference/einrichtung.md im Orchestrator-Repository.
# Stoppgruende: nur die eingebauten des Orchestrators (siehe AGENTS.md).
# Belegung: ohne [roles]/[agent_profiles] gilt die mitgelieferte Standardbelegung
# Codex (Implementierer) / Claude (Pruefer und Finalpruefer); Haengererkennung
# mit den Standardwerten (900 s Modellstille, 3600 s je Befehl).
# Toolchain: node und npm kommen aus dem System, node_modules liegt im
# Repository. Der gehaertete Codex-Implementierer braucht deshalb keine
# toolchain_read_roots; ein Node unter dem Home-Verzeichnis (etwa nvm) ist in
# seiner Sandbox unsichtbar, dort laufen /usr/bin/node und /usr/bin/npm
# (gemessen am 02.10.2026 mit codex sandbox und dem erzeugten Rechteprofil).
# Abschluss: bewusst Standard (merge_completed_branch = true). Nach befundfreier
# Abnahme merged der Orchestrator lokal nach main und startet danach den lokalen
# post-merge-Hook (Grenze 600 s). Gepusht wird nie.

[repository]
base_branch = "main"

[paths]
productive = [
    "app/**", "engine/**", "workers/**", "types/**", "css/**", "assets/**",
    "data/**", "config/**", "scripts/**", "tools/**", "src-tauri/**",
    "*.html", "*.js", "*.mjs", "*.css",
    "package.json", "package-lock.json", "start_suite.cmd", "orchestrator.toml", ".github/**",
]
tests = ["tests/**"]
documentation = ["docs/**", "*.md", "Presentation/**", "audit/**"]
generated = [
    ".orchestrator/**", "node_modules/**", "dist/**", ".coverage/**",
    "src-tauri/target/**", "src-tauri/gen/**",
]

[validation]
default_command = ["npm", "test"]
default_timeout_seconds = 1200

# Browser-Smoke (Playwright/Chromium) als zusaetzliche Pruefung ausserhalb der
# Agenten-Sandbox: laeuft, sobald ein Arbeitspaket Oberflaeche, Logik oder den
# Smoke selbst aendert. In der Sandbox scheitert er am Serverstart (listen EPERM).
[[validation.rules]]
patterns = [
    "app/**", "engine/**", "workers/**", "types/**", "css/**", "assets/**",
    "*.html", "*.js", "*.mjs", "tests/browser-smoke.test.mjs", "package.json",
]
command = ["npm", "run", "test:browser"]
timeout_seconds = 900

[workflow]
plan_gate = false
test_change_gate = false
manual_slice_gate = false
scope_extension_gate = false
